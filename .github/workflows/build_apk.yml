name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب جاوا
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: نصب فلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: ساخت پوسته اندروید (بدون تغییر pubspec.yaml و lib/ موجود)
        run: flutter create --platforms=android --org com.parshan --project-name daftaryar .

      - name: ارتقای compileSdk/targetSdk به ۳۶ (رفع نیاز پلاگین‌ها)
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          cat >> android/app/build.gradle.kts << 'EOF'

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF
          cat android/app/build.gradle.kts
          cat >> android/build.gradle.kts << 'EOF'

          subprojects {
              val applyCompileSdkFix: () -> Unit = {
                  extensions.findByName("android")?.let { ext ->
                      val setCompileSdk = ext.javaClass.methods.firstOrNull {
                          it.name == "setCompileSdkVersion" &&
                              it.parameterTypes.size == 1 &&
                              it.parameterTypes[0] == Int::class.java
                      }
                      setCompileSdk?.invoke(ext, 36)
                  }
              }
              if (state.executed) {
                  applyCompileSdkFix()
              } else {
                  afterEvaluate { applyCompileSdkFix() }
              }
          }
          EOF
          echo 'kotlin.jvm.target.validation.mode=warning' >> android/gradle.properties

      - name: تنظیم اندروید برای قفل اثر انگشت (local_auth) و خواندن پیامک بانکی
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/kotlin -name "MainActivity.kt")
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$MAIN_ACTIVITY"
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.RECEIVE_SMS" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.READ_SMS" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.SEND_SMS" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.READ_PHONE_STATE" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml
          python3 - << 'PYEOF'
path = "android/app/src/main/AndroidManifest.xml"
content = open(path).read()
receiver = '''        <receiver android:name="com.shounakmulay.telephony.sms.IncomingSmsReceiver"
            android:permission="android.permission.BROADCAST_SMS" android:exported="true">
            <intent-filter>
                <action android:name="android.provider.Telephony.SMS_RECEIVED"/>
            </intent-filter>
        </receiver>
    </application>'''
content = content.replace('</application>', receiver, 1)
open(path, "w").write(content)
print("receiver added")
PYEOF
          cat "$MAIN_ACTIVITY"
          cat android/app/src/main/AndroidManifest.xml

      - name: دریافت بسته‌ها
        run: flutter pub get

      - name: ساخت APK ریلیز
        run: flutter build apk --release --split-per-abi

      - name: بارگذاری APK به عنوان artifact
        uses: actions/upload-artifact@v4
        with:
          name: daftaryar-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
