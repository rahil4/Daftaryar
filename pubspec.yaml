name: daftaryar
description: "دفتریار - حسابداری دفتر خدمات نقشه‌برداری و امور ثبتی"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  shamsi_date: ^1.1.1
  intl: ^0.20.3
  share_plus: ^7.2.2
  fl_chart: ^0.68.0
  pdf: ^3.10.8
  printing: ^5.13.1
  excel: ^4.0.2
  local_auth: ^2.3.0
  crypto: ^3.0.3
  another_telephony: ^0.4.1
  flutter_local_notifications: ^17.2.3
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
